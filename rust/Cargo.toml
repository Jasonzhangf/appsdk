[package]
name = "appsdk"
version = "0.1.6"
edition = "2021"
description = "Compiled AppSDK governance CLI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
