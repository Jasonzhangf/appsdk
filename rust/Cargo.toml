[package]
name = "appsdk"
version = "0.1.7"
edition = "2021"
description = "Compiled AppSDK governance CLI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
pipeline_runtime = { git = "https://github.com/Jasonzhangf/DAGpipe", rev = "d88070c9a2ebaaf06d19ebc00ae313bd5f44fd8b" }

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
